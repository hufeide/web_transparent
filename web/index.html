<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>立体透明 · 一只可爱的猫</title>
  <style>
    :root {
      --bg-top: #eef4ff;
      --bg-bottom: #ffe9f5;
      --glass: rgba(255, 255, 255, 0.38);
      --glass-border: rgba(255, 255, 255, 0.6);
      --ink: #241e2c;
      --muted: rgba(36, 30, 44, 0.72);
      --accent: #ff8aa5;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-top: #121019;
        --bg-bottom: #241220;
        --glass: rgba(255, 255, 255, 0.18);
        --glass-border: rgba(255, 255, 255, 0.30);
        --ink: #f4efe9;
        --muted: rgba(244, 239, 233, 0.72);
        --accent: #ff9fb8;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(60% 60% at 25% 30%, rgba(184, 217, 255, 0.9), transparent 60%),
        radial-gradient(55% 55% at 75% 80%, rgba(255, 199, 224, 0.85), transparent 55%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));)
      display: grid;
      place-items: center;
      font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--ink);
      overflow: hidden;
    }

    .scene {
      position:relative;
      width:min(78vw, 640px);
      aspect-ratio:1 / 1.15;
      perspective:900px;
      z-index:1;
    }

    .stage {
      transform-style:preserve-3d;
      transition:transform 120ms ease-out;
      width:100%;
      height:100%;
      cursor:grab;}

    .card{
      position:absolute;
      inset:0;
      background:
        radial-gradient(120% 90% at 50% -20%, rgba(255,255,255,0.6), transparent 35%),
        var(--glass);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border:1px solid var(--glass-border);
      border-radius:28px;
      box-shadow:
        inset 0 0 80px rgba(255,255,255,0.25),
        inset 0 1px 2px rgba(255,255,255,.4),
        0 30px 60px -30px var(--glow),
        0 2px 10px rgba(20,10,30,.18);
      display:grid;
      grid-template-columns:1fr 1fr;}

    @media (max-width:560px){ .card{grid-template-columns:1fr;} }

    .col{
      transform-style:preserve-3d;
      transition:transform 120ms ease-out;
      backdrop-filter:blur(6px);
      border-radius:18px;
      background:rgba(255,255,255,.24);
      border:1px solid var(--glass-border);
      padding:clamp(12px, 2.6vw, 20px);}

    .cat-wrap{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:clamp(140px, 36vw, 230px);
      overflow:hidden;}

    .cat-svg{
      width:min(78%, 300px);
      height:auto;
      filter:drop-shadow(0 10px 20px rgba(60, 20, 50, 0.15));
    }

    .cat-face{ animation:bob 3s ease-in-out infinite alternate-reverse; }
    @keyframes bob{
      from{transform:translateY(0);} to{transform:translateY(-8px) rotate(1.5deg);}
    }

    .info h1{ font-size:clamp(24px, 4.6vw, 34px); line-height:1.1; margin:0 0 8px; }
    .info p{
      color:var(--muted);
      font-size:clamp(15px, 2.6vw, 17px);
      line-height:1.45;
    }
    .pill{
      display:inline-block;
      background:var(--accent);
      color:#fff;
      border-radius:999px;
      padding:4px 12px;
      font-size:12px;
      margin-top:10px;}

    .hint{
      position:absolute;
      bottom:clamp(8px, 2vw, 20px);
      left:50%;
      transform:translateX(-50%);
      font-size:14px;
      color:var(--muted);}

    @media (prefers-reduced-motion: reduce){
      *{ animation:none !important; transition:none !important; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="stage" id="stage">
      <article class="card">
        <!-- Left: Cat -->
        <section class="col left">
          <div class="cat-wrap">
            <svg class="cat-svg cat-face" viewBox="0 0 512 512" role="img" aria-label="A cute transparent cat" preserveAspectRatio="xMidYMid meet">              <!-- Head -->
              <circle cx="256" cy="300" r="150" fill="#fff" stroke="#8a7b9e" stroke-width="6"/>

              <!-- Left ear -->
              <path d="M190 240 L235 160 L290 240 Z" fill="#fbd6ec" stroke="#8a7b9e" stroke-width="6" stroke-linejoin="round"/>
              <!-- Left ear inner -->
              <path d="M205 235 L235 190 L265 235 Z" fill="#ffc6d9" stroke="#8a7b9e" stroke-width="4" stroke-linejoin="round"/>

              <!-- Right ear -->
              <path d="M335 240 L377 160 L422 240 Z" fill="#fbd6ec" stroke="#8a7b9e" stroke-width="6" stroke-linejoin="round"/>
              <!-- Right ear inner -->
              <path d="M350 235 L377 190 L407 235 Z" fill="#ffc6d9" stroke="#8a7b9e" stroke-width="4" stroke-linejoin="round"/>

              <!-- Whiskers -->
              <g stroke="#a091b8" stroke-width="4" fill="none" stroke-linecap="round">
                <line x1="132" y1="275" x2="98" y2="258"/>
                <line x1="132" y1="305" x2="94" y2="305"/>
                <line x1="132" y1="335" x2="98" y2="352"/>
                <line x1="380" y1="275" x2="414" y2="258"/>
                <line x1="380" y1="305" x2="418" y2="305"/>
                <line x1="380" y1="335" x2="414" y2="352"/>
              </g>

              <!-- Eyes -->
              <ellipse cx="220" cy="286" rx="18" ry="28" fill="#7b6a9f" stroke="#8a7b9e" stroke-width="4"/>
              <ellipse cx="340" cy="286" rx="18" ry="28" fill="#7b6a9f" stroke="#8a7b9e" stroke-width="4"/>

              <!-- Pupils -->
              <ellipse cx="220" cy="282" rx="8" ry="15" fill="#2d223a"/>
              <ellipse cx="340" cy="282" rx="8" ry="15" fill="#2d223a"/>

              <!-- Eye highlights -->
              <circle cx="227" cy="272" r="6" fill="#fff"/>
              <circle cx="347" cy="272" r="6" fill="#fff"/>

              <!-- Cheeks -->
              <ellipse cx="160" cy="335" rx="16" ry="10" fill="#ffc6d9" opacity="0.85" transform="rotate(-14 160 335)"/>
              <ellipse cx="372" cy="335" rx="16" ry="10" fill="#ffc6d9" opacity="0.85" transform="rotate(14 372 335)"/>

              <!-- Nose -->
              <path d="M256 304 C244 296, 228 296, 240 310 C246 316, 256 318, 256 318 C256 318, 266 316, 272 310 C284 296, 268 296, 256 304 Z" fill="#ff9ab0" stroke="#8a7b9e" stroke-width="5"/>

              <!-- Mouth -->
              <path d="M256 318 L242 334 M256 318 L270 334" stroke="#a091b8" stroke-width="5" fill="none" stroke-linecap="round"/>

              <!-- Body -->
              <path d="M158 430 C176 398, 240 372, 302 372 C364 372, 420 398, 440 430 L396 496 C352 516, 268 516, 224 496 Z" fill="#f8fbff" stroke="#8a7b9e" stroke-width="6" stroke-linejoin="round"/>

              <!-- Belly -->
              <path d="M230 410 L285 410 C276 428, 285 428, 278 410 Z" fill="#eef3ff" stroke="#a091b8" stroke-width="4"/>

              <!-- Collar -->
              <rect x="190" y="426" width="108" height="24" rx="10" fill="#ffd3e3" stroke="#8a7b9e" stroke-width="5"/>
              <circle cx="244" cy="448" r="10" fill="#f6c0d6" stroke="#8a7b9e" stroke-width="4"/>

              <!-- Tail -->
              <path d="M432 375 C466 342, 478 306, 462 282 C446 258, 420 270, 400 300 C392 320, 406 334, 428 318" fill="#fff" stroke="#8a7b9e" stroke-width="6" stroke-linejoin="round"/>
            </svg>
          </div>
        </section>

        <!-- Right: Info -->
        <section class="col right info">
          <h1>Hi, I'm <span style="color:var(--accent)">Fei</span></h1>
          <p>一只在屏幕里轻轻晃动的透明小猫，喜欢 3D、玻璃质感、一点点动态。把鼠标按下来往左右拖动，就能旋转整张卡片。</p>
          <span class="pill">&#128194; 立体透明 · Glassmorphism</span>
        </section>
      </article>
    </div>

    <div class="hint">&#8706; 按住左右拖动，可以旋转整张卡片</div>
  </div>

  <script>
(function() {
  var stage = document.getElementById('stage');
  var catFace = document.querySelector('.cat-face');

  var rotateX = 0, rotateY = 0;
  var targetX = 0, targetY = 0;

  function applyTransform(){
    stage.style.transform = 'rotateX(' + rotateX.toFixed(2) + 'deg) rotateY(' + rotateY.toFixed(2) + 'deg)';
    if (catFace)
      catFace.style.transform = 'translateZ(' + (Math.sin(rotateY * Math.PI / 180) * -6).toFixed(1) + 'px) rotateY(' + (rotateY * 0.35).toFixed(2) + 'deg)';
    var rightCol = document.querySelector('.col.right');
    if (rightCol)
      rightCol.style.transform = 'translateZ(48px) rotateY(' + (rotateY * 0.18).toFixed(2) + 'deg)';
  }

  function animate(){
    rotateX += (targetX - rotateX) * 0.15;
    rotateY += (targetY - rotateY) * 0.15;
    applyTransform();
    requestAnimationFrame(animate);
  }

  var dragging = false, startX = 0, startAngleY = 0;

  stage.addEventListener('pointerdown', function(e){
    dragging = true;
    startX = e.clientX;
    startAngleY = targetY;
    applyTransform();
    e.preventDefault();
  });

  stage.addEventListener('pointermove', function(e){
    if (dragging) {
      var delta = e.clientX - startX;
      targetY = startAngleY + delta * 0.45;
    }
  });

  window.addEventListener('pointerup', function(){ dragging = false; });
  window.addEventListener('pointercancel', function(){ dragging = false; });

  // hover slight tilt
  stage.addEventListener('mousemove', function(e){
    var rect = stage.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width - 0.5;
    targetX += (x * 14 - targetX) * 0.06;
  });

  stage.addEventListener('mouseleave', function(){ targetX = 0; });

  animate();
})();
</script>
</body>
</html>
